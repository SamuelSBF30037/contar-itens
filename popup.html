<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador de Palavras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 20px;
        }
        .palavra-input {
            margin-bottom: 5px;
        }
        #page-info {
            font-size: 12px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>Contador de Palavras no DOPM</h2>
    <div id="page-info">Carregando informações da página...</div>
    <div id="inputs">
        <input type="text" class="palavra-input" placeholder="Digite a palavra 1..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 2..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 3..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 4..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 5..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 6..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 7..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 8..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 9..." />
        <input type="text" class="palavra-input" placeholder="Digite a palavra 10..." />
    </div>
    <button id="contar">Contar</button>
    <p id="resultado"></p>
    <script src="popup.js"></script>
</body>
</html>
